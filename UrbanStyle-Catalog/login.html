<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login Admin - Nurul Fashion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { width: 100%; overflow-x: hidden; height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            background: #060913;
            position: relative;
            overflow-x: hidden;
            font-family: 'Times New Roman', Times, serif;
            width: 100%;
            max-width: 100%;
        }

        /* Killua Dynamic Electric Canvas */
        #killuaCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Killua Aura Vignette & Ambient Glow */
        .killua-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(3, 7, 18, 0.75) 90%),
                        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 50%);
        }

        /* Glassmorphic Translucent Login Card */
        .login-card {
            background: rgba(10, 16, 30, 0.74);
            padding: 36px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75), 0 0 40px rgba(0, 240, 255, 0.16);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 3;
            animation: cardSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.32);
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo { text-align: center; margin-bottom: 22px; }
        .login-logo .logo {
            width: 66px; height: 66px;
            background: linear-gradient(135deg, #FF69B4, #FFB6C1, #FF1493);
            color: #FFFFFF; font-size: 26px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px; margin: 0 auto 12px;
            box-shadow: 0 8px 30px rgba(255, 105, 180, 0.4), 0 0 20px rgba(0, 240, 255, 0.3);
            transition: transform 0.3s ease;
            position: relative;
        }
        .login-logo .logo:hover { transform: rotate(-5deg) scale(1.06); }
        .login-logo h2 { font-size: 24px; font-weight: 700; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .login-logo p { color: #94a3b8; font-size: 13px; margin-top: 4px; }
        
        .security-badge-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 20px;
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(148, 163, 184, 0.28);
            border-radius: 10px;
            font-family: 'Times New Roman', Times, serif; font-size: 15px;
            color: #ffffff;
            transition: all 0.3s ease; outline: none;
            box-sizing: border-box;
        }
        .form-group input::placeholder { color: #64748b; }
        .form-group input:focus {
            border-color: #00f0ff;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 48px !important; }
        .password-toggle {
            position: absolute; right: 2px; top: 2px; bottom: 2px; width: 44px;
            background: transparent; border: none; border-radius: 8px;
            color: #94a3b8; font-size: 17px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .password-toggle:hover { color: #00f0ff; background: rgba(0, 240, 255, 0.1); }

        /* Robot Checkbox ('Saya bukan robot') Styles */
        .robot-check-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.65);
            border: 1.5px solid rgba(148, 163, 184, 0.28);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 16px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
        }
        .robot-check-container.error-highlight {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
        }
        .robot-check-container.verified {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.12);
        }
        .robot-check-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .robot-checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #64748b;
            border-radius: 6px;
            background: rgba(30, 41, 59, 0.8);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.2s ease;
            position: relative;
        }
        .robot-checkbox:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .robot-checkbox:focus-visible {
            outline: 2px solid #00f0ff;
            outline-offset: 2px;
        }
        .robot-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2.5px solid #475569;
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: robotSpin 0.7s linear infinite;
        }
        @keyframes robotSpin {
            to { transform: rotate(360deg); }
        }
        .robot-check-icon {
            display: none;
            color: #10b981;
            font-size: 16px;
            animation: checkBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes checkBounce {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .robot-checkbox.loading {
            border-color: #00f0ff;
            background: rgba(30, 41, 59, 0.9);
        }
        .robot-checkbox.loading .robot-spinner {
            display: block;
        }
        .robot-checkbox.checked {
            border-color: #10b981;
            background: rgba(30, 41, 59, 0.9);
        }
        .robot-checkbox.checked .robot-check-icon {
            display: block;
        }
        .robot-label {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            cursor: pointer;
            margin: 0;
        }
        .robot-check-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #94a3b8;
        }
        .robot-brand-icon {
            font-size: 18px;
            color: #00f0ff;
        }
        .robot-brand-text {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .robot-brand-links {
            font-size: 9px;
            color: #64748b;
        }
        .robot-brand-links a {
            color: #94a3b8;
            text-decoration: none;
        }
        .robot-brand-links a:hover {
            color: #00f0ff;
            text-decoration: underline;
        }

        /* 2FA Form Step */
        .step-panel {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .step-hidden {
            display: none !important;
        }
        .two-factor-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .two-factor-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(168, 85, 247, 0.25));
            border: 2px solid rgba(56, 189, 248, 0.4);
            color: #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 12px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            animation: pulse2FA 2s infinite ease-in-out;
        }
        @keyframes pulse2FA {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.25); }
            50% { transform: scale(1.05); box-shadow: 0 0 32px rgba(0, 240, 255, 0.5); }
        }
        .two-factor-header h3 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .two-factor-header p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 18px 0;
        }
        .otp-digit {
            width: 48px;
            height: 52px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.75);
            outline: none;
            transition: all 0.2s ease;
            font-family: monospace;
            color: #00f0ff;
        }
        .otp-digit:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.25), 0 0 15px rgba(0, 240, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Notice / Error / Info Messages */
        .login-error {
            display: none; align-items: flex-start; gap: 8px;
            padding: 12px 14px; background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5;
            border-radius: 10px; font-size: 13px; font-weight: 500;
            margin-bottom: 14px; animation: errorShake 0.4s ease;
            line-height: 1.4;
        }
        .login-info {
            display: none; align-items: flex-start; gap: 8px;
            padding: 12px 14px; background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8;
            border-radius: 10px; font-size: 13px; font-weight: 500;
            margin-bottom: 14px; line-height: 1.4;
        }
        .login-countdown {
            display: none; align-items: center; gap: 8px;
            padding: 12px 14px; background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4); color: #fde68a;
            border-radius: 10px; font-size: 13px; font-weight: 600;
            margin-bottom: 14px; line-height: 1.4;
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .login-success {
            display: none; align-items: center; gap: 8px;
            padding: 12px 14px; background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac;
            border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 14px;
        }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px 24px; border-radius: 12px;
            font-family: 'Times New Roman', Times, serif; font-size: 15px; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: all 0.3s ease;
            border: none; min-height: 46px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00f0ff 0%, #0284c7 45%, #FF1493 100%);
            color: #FFFFFF;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3), 0 0 15px rgba(255, 20, 147, 0.25);
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.45), 0 0 25px rgba(255, 20, 147, 0.35);
        }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none !important; }
        
        .btn-secondary-action {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px; padding: 12px;
            background: rgba(15, 23, 42, 0.55);
            color: #cbd5e1;
            border: 1.5px solid rgba(148, 163, 184, 0.28);
            border-radius: 12px;
            font-family: 'Times New Roman', Times, serif; font-size: 13.5px; font-weight: 500;
            text-decoration: none; transition: all 0.3s ease; width: 100%; cursor: pointer;
        }
        .btn-secondary-action:hover {
            border-color: #00f0ff;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .login-card { padding: 26px 18px; border-radius: 20px; }
            .login-logo { margin-bottom: 18px; }
            .login-logo .logo { width: 56px; height: 56px; font-size: 22px; }
            .login-logo h2 { font-size: 21px; }
            .otp-digit { width: 40px; height: 46px; font-size: 19px; }
            .form-group input { font-size: 14.5px; }
        }
    </style>
</head>
<body>
    <!-- Killua Animated Canvas -->
    <canvas id="killuaCanvas" aria-hidden="true"></canvas>
    <div class="killua-vignette" aria-hidden="true"></div>

    <div class="login-card">
        <div class="login-logo">
            <div class="logo">NF</div>
            <h2>Admin Portal</h2>
            <p>Sistem Manajemen Katalog Nurul Fashion</p>
            <div class="security-badge-top">
                <i class="fas fa-shield-alt"></i> Keamanan Terlindungi
            </div>
        </div>

        <!-- System / Session Timeout Notice -->
        <div id="loginInfoBanner" class="login-info" role="status"></div>
        <div id="loginCountdown" class="login-countdown" aria-live="polite"></div>
        <div id="loginError" class="login-error" role="alert"></div>
        <div id="loginSuccess" class="login-success" role="status"></div>

        <!-- ================= STEP 1: KREDENSIAL + CAPTCHA ================= -->
        <div id="stepLogin" class="step-panel">
            <form id="loginForm" class="login-form" novalidate>
                <!-- Honeypot Bot Traps (Invisible to real users, bots will auto-fill) -->
                <div style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;" aria-hidden="true">
                    <input type="text" id="hp_user_website" name="hp_user_website" tabindex="-1" autocomplete="off">
                    <input type="text" id="hp_secondary_phone" name="hp_secondary_phone" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="loginEmail">Email Admin</label>
                    <input type="email" id="loginEmail" placeholder="admin@nurulfashion.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle" tabindex="-1" title="Lihat/Sembunyikan Password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Verifikasi 'Saya bukan robot' -->
                <div class="robot-check-container" id="robotCheckContainer">
                    <div class="robot-check-left" id="robotCheckTrigger">
                        <button type="button" class="robot-checkbox" id="robotCheckbox" role="checkbox" aria-checked="false" aria-label="Saya bukan robot">
                            <span class="robot-spinner"></span>
                            <i class="fas fa-check robot-check-icon"></i>
                        </button>
                        <span class="robot-label" id="robotLabel">Saya bukan robot</span>
                    </div>
                    <div class="robot-check-right">
                        <div class="robot-brand-icon">
                            <i class="fas fa-shield-halved"></i>
                        </div>
                        <span class="robot-brand-text">Proteksi</span>
                        <div class="robot-brand-links">
                            <a href="#" tabindex="-1" onclick="return false;">Privasi</a> &bull; <a href="#" tabindex="-1" onclick="return false;">Ketentuan</a>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-lock"></i> Masuk ke Dashboard
                </button>

                <a href="index.html" class="btn-secondary-action">
                    <i class="fas fa-arrow-left"></i> Kembali ke Halaman Katalog
                </a>
            </form>
        </div>

        <!-- ================= STEP 2: VERIFIKASI 2 LANGKAH (2FA) ================= -->
        <div id="step2FA" class="step-panel step-hidden">
            <div class="two-factor-header">
                <div class="two-factor-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h3>Verifikasi 2 Langkah</h3>
                <p>Masukkan 6 digit kode keamanan dari aplikasi autentikasi Anda (Google Authenticator / Authy).</p>
            </div>

            <form id="form2FA" novalidate>
                <div class="otp-inputs" id="otpInputsContainer">
                    <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="0" autofocus>
                    <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="1">
                    <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="2">
                    <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="3">
                    <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="4">
                    <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="5">
                </div>

                <button type="submit" class="btn btn-primary" id="btnVerify2FA">
                    <i class="fas fa-check-shield"></i> Verifikasi &amp; Masuk
                </button>

                <button type="button" class="btn-secondary-action" id="btnCancel2FA">
                    <i class="fas fa-arrow-left"></i> Gunakan Akun Lain
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import supabase, {
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            getMfaAssuranceLevel,
            listMfaFactors,
            challengeAndVerifyMfa
        } from "./auth.js";

        // ===== 1. ANTI-CLICKJACKING FRAMEBUSTER =====
        if (window.top !== window.self) {
            try {
                window.top.location = window.self.location;
            } catch (e) {
                document.body.innerHTML = 'Akses melalui iframe diblokir demi keamanan.';
            }
        }

        // ===== 2. STATE & PERSISTENT BRUTE-FORCE RATE LIMITING =====
        const RATE_LIMIT_STORAGE_KEY = '_nf_auth_rate_guard_v2';
        const pageLoadTimestamp = Date.now();
        let isRobotVerified = false;
        let pendingMfaFactorId = null;
        let countdownInterval = null;

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const robotCheckbox = document.getElementById('robotCheckbox');
        const robotCheckContainer = document.getElementById('robotCheckContainer');
        const robotCheckTrigger = document.getElementById('robotCheckTrigger');

        const stepLogin = document.getElementById('stepLogin');
        const step2FA = document.getElementById('step2FA');
        const form2FA = document.getElementById('form2FA');
        const btnVerify2FA = document.getElementById('btnVerify2FA');
        const btnCancel2FA = document.getElementById('btnCancel2FA');
        const otpInputs = Array.from(document.querySelectorAll('.otp-digit'));

        const infoBannerEl = document.getElementById('loginInfoBanner');
        const countdownEl = document.getElementById('loginCountdown');
        const errorEl = document.getElementById('loginError');
        const successEl = document.getElementById('loginSuccess');

        // Check URL parameters for session notifications
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reason') === 'session_timeout') {
            infoBannerEl.innerHTML = '<i class="fas fa-info-circle"></i> Sesi Anda telah berakhir otomatis demi keamanan karena tidak ada aktivitas. Silakan login kembali.';
            infoBannerEl.style.display = 'flex';
        } else if (urlParams.get('reason') === 'unauthorized') {
            infoBannerEl.innerHTML = '<i class="fas fa-shield-alt"></i> Anda harus login terlebih dahulu untuk mengakses dashboard admin.';
            infoBannerEl.style.display = 'flex';
        }

        function getRateLimitState() {
            try {
                const data = localStorage.getItem(RATE_LIMIT_STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed && typeof parsed.attempts === 'number') {
                        return parsed;
                    }
                }
            } catch (e) {
                console.warn('Gagal membaca storage rate limit:', e);
            }
            return { attempts: 0, lockoutUntil: 0 };
        }

        function saveRateLimitState(attempts, lockoutUntil = 0) {
            try {
                localStorage.setItem(RATE_LIMIT_STORAGE_KEY, JSON.stringify({
                    attempts,
                    lockoutUntil,
                    updatedAt: Date.now()
                }));
            } catch (e) {
                console.warn('Gagal menyimpan storage rate limit:', e);
            }
        }

        function clearRateLimitState() {
            try {
                localStorage.removeItem(RATE_LIMIT_STORAGE_KEY);
            } catch (e) {}
        }

        function calculateLockoutDuration(attempts) {
            // Skema lockout bertingkat:
            // 3x salah: 60 detik (1 menit)
            // 4x salah: 180 detik (3 menit)
            // 5x+ salah: 600 detik (10 menit)
            if (attempts >= 5) return 600;
            if (attempts === 4) return 180;
            if (attempts >= 3) return 60;
            return 0;
        }

        function checkAndApplyLockout() {
            const state = getRateLimitState();
            const now = Date.now();
            if (state.lockoutUntil && state.lockoutUntil > now) {
                startCountdown(state.lockoutUntil);
                return true;
            } else if (state.lockoutUntil && state.lockoutUntil <= now) {
                // Lockout selesai
                stopCountdown();
                saveRateLimitState(Math.min(state.attempts, 2), 0);
            }
            return false;
        }

        function startCountdown(targetTime) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            loginBtn.disabled = true;
            if (btnVerify2FA) btnVerify2FA.disabled = true;

            const tick = () => {
                const remainingSec = Math.max(0, Math.ceil((targetTime - Date.now()) / 1000));
                if (remainingSec <= 0) {
                    stopCountdown();
                    return;
                }
                const mins = Math.floor(remainingSec / 60);
                const secs = remainingSec % 60;
                const timeText = mins > 0 ? `${mins} menit ${secs} detik` : `${secs} detik`;
                countdownEl.innerHTML = `<i class="fas fa-ban"></i> Terlalu banyak percobaan gagal. Akses dibatasi sementara selama <strong>${timeText}</strong> demi keamanan.`;
                countdownEl.style.display = 'flex';
                errorEl.style.display = 'none';
            };

            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        function stopCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            countdownEl.style.display = 'none';
            loginBtn.disabled = false;
            if (btnVerify2FA) btnVerify2FA.disabled = false;
        }

        function registerFailedAttempt() {
            const state = getRateLimitState();
            const newAttempts = state.attempts + 1;
            const lockoutDuration = calculateLockoutDuration(newAttempts);

            if (lockoutDuration > 0) {
                const lockoutUntil = Date.now() + lockoutDuration * 1000;
                saveRateLimitState(newAttempts, lockoutUntil);
                startCountdown(lockoutUntil);
            } else {
                saveRateLimitState(newAttempts, 0);
            }
            return newAttempts;
        }

        // ===== 3. VERIFIKASI "SAYA BUKAN ROBOT" =====
        function verifyRobotClick() {
            if (isRobotVerified) return;
            if (robotCheckContainer) robotCheckContainer.classList.remove('error-highlight');
            if (robotCheckbox) {
                robotCheckbox.classList.add('loading');
                robotCheckbox.setAttribute('aria-checked', 'mixed');
            }

            setTimeout(() => {
                if (robotCheckbox) {
                    robotCheckbox.classList.remove('loading');
                    robotCheckbox.classList.add('checked');
                    robotCheckbox.setAttribute('aria-checked', 'true');
                }
                if (robotCheckContainer) robotCheckContainer.classList.add('verified');
                isRobotVerified = true;
                errorEl.style.display = 'none';
            }, 600);
        }

        function resetRobotVerification() {
            isRobotVerified = false;
            if (robotCheckbox) {
                robotCheckbox.classList.remove('loading', 'checked');
                robotCheckbox.setAttribute('aria-checked', 'false');
            }
            if (robotCheckContainer) {
                robotCheckContainer.classList.remove('verified', 'error-highlight');
            }
        }

        if (robotCheckTrigger) {
            robotCheckTrigger.addEventListener('click', verifyRobotClick);
        }
        if (robotCheckbox) {
            robotCheckbox.addEventListener('click', (e) => {
                e.stopPropagation();
                verifyRobotClick();
            });
            robotCheckbox.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    verifyRobotClick();
                }
            });
        }

        // ===== 4. SECURE ERROR MESSAGING HELPER =====
        function showError(message) {
            errorEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span>${message}</span>`;
            errorEl.style.display = 'flex';
            successEl.style.display = 'none';
        }

        function showSuccess(message) {
            successEl.innerHTML = `<i class="fas fa-check-circle"></i> <span>${message}</span>`;
            successEl.style.display = 'flex';
            errorEl.style.display = 'none';
        }

        // ===== 5. 2FA (TWO-FACTOR AUTHENTICATION) DIGIT HANDLING =====
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                e.target.value = val ? val[0] : '';
                if (val && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
                const cleanDigits = pasteData.replace(/\D/g, '').slice(0, 6);
                if (cleanDigits) {
                    cleanDigits.split('').forEach((char, i) => {
                        if (otpInputs[i]) otpInputs[i].value = char;
                    });
                    const focusIdx = Math.min(cleanDigits.length, 5);
                    otpInputs[focusIdx].focus();
                }
            });
        });

        function getOtpCode() {
            return otpInputs.map(i => i.value).join('').trim();
        }

        function clearOtpInputs() {
            otpInputs.forEach(i => i.value = '');
            if (otpInputs[0]) otpInputs[0].focus();
        }

        function switchToStep(step) {
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            if (step === '2fa') {
                stepLogin.classList.add('step-hidden');
                step2FA.classList.remove('step-hidden');
                clearOtpInputs();
            } else {
                step2FA.classList.add('step-hidden');
                stepLogin.classList.remove('step-hidden');
                pendingMfaFactorId = null;
                resetRobotVerification();
            }
        }

        btnCancel2FA.addEventListener('click', async () => {
            try {
                await signOut();
            } catch (e) {}
            switchToStep('login');
        });

        // ===== 6. AUTH STATE CHECK ON LOAD =====
        onAuthStateChanged(async (user) => {
            if (user) {
                // Jangan auto-redirect jika sedang di tengah flow 2FA
                const assurance = await getMfaAssuranceLevel().catch(() => null);
                if (assurance?.nextLevel === 'aal2' && assurance?.currentLevel !== 'aal2') {
                    // Masih butuh faktor 2
                    return;
                }
                showSuccess('Sesi login terdeteksi. Mengarahkan...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 600);
            }
        });

        // Password Visibility Toggle
        document.getElementById('passwordToggle').addEventListener('click', () => {
            const input = document.getElementById('loginPassword');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            document.getElementById('passwordToggle').innerHTML = type === 'password' ?
                '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // Initialize state
        checkAndApplyLockout();

        // ===== 7. STEP 1 LOGIN SUBMIT HANDLER =====
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Cek lockout aktif
            if (checkAndApplyLockout()) return;

            // Honeypot Trap (Bot Protection)
            const hp1 = document.getElementById('hp_user_website')?.value;
            const hp2 = document.getElementById('hp_secondary_phone')?.value;
            if (hp1 || hp2) {
                // Silently block automated scraper bot
                showError('Aktivitas tidak wajar terdeteksi. Silakan muat ulang browser Anda.');
                return;
            }

            // Submission speed check (Human takes at least 0.8 seconds)
            if (Date.now() - pageLoadTimestamp < 800) {
                showError('Pengiriman form terlalu cepat terdeteksi. Silakan coba lagi.');
                resetRobotVerification();
                return;
            }

            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email || !password) {
                showError('Email dan password wajib diisi.');
                return;
            }

            // Validasi 'Saya bukan robot'
            if (!isRobotVerified) {
                showError("Silakan centang 'Saya bukan robot' terlebih dahulu.");
                if (robotCheckContainer) robotCheckContainer.classList.add('error-highlight');
                return;
            }

            try {
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi Kredensial...';
                loginBtn.disabled = true;
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                // Artificial delay (1s) to prevent high-speed brute force automated timing
                await new Promise(res => setTimeout(res, 900));

                const { user } = await signInWithEmailAndPassword(email, password);

                // Periksa apakah user memiliki 2FA aktif (Supabase MFA)
                const assurance = await getMfaAssuranceLevel();
                const factors = await listMfaFactors();
                const verifiedTotp = factors?.totp?.find(f => f.status === 'verified');

                if (verifiedTotp && (assurance?.nextLevel === 'aal2' || assurance?.currentLevel !== 'aal2')) {
                    // Alihkan ke Step 2: Verifikasi 2 Langkah
                    pendingMfaFactorId = verifiedTotp.id;
                    loginBtn.innerHTML = '<i class="fas fa-lock"></i> Masuk ke Dashboard';
                    loginBtn.disabled = false;
                    switchToStep('2fa');
                    return;
                }

                // Jika tidak ada 2FA, login langsung berhasil
                clearRateLimitState();
                showSuccess('Login berhasil! Mengarahkan ke dashboard admin...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (err) {
                // Increment failed attempts and apply lockout if threshold reached
                const attempts = registerFailedAttempt();
                resetRobotVerification();

                // OWASP Secure Error Message: Never enumerate whether email or password was wrong
                const maxAttemptsBeforeLock = 3;
                const remaining = Math.max(0, maxAttemptsBeforeLock - (attempts % maxAttemptsBeforeLock));
                let errorMsg = 'Email atau password yang Anda masukkan tidak valid.';
                if (remaining > 0 && attempts < 3) {
                    errorMsg += ` (Percobaan tersisa: ${remaining})`;
                }
                showError(errorMsg);

            } finally {
                if (!pendingMfaFactorId) {
                    loginBtn.innerHTML = '<i class="fas fa-lock"></i> Masuk ke Dashboard';
                    loginBtn.disabled = checkAndApplyLockout();
                }
            }
        });

        // ===== 8. STEP 2: 2FA VERIFY SUBMIT HANDLER =====
        form2FA.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (checkAndApplyLockout()) return;

            const code = getOtpCode();
            if (code.length !== 6) {
                showError('Masukkan 6 digit kode keamanan autentikasi.');
                return;
            }

            try {
                btnVerify2FA.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memvalidasi 2FA...';
                btnVerify2FA.disabled = true;
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                if (!pendingMfaFactorId) {
                    const factors = await listMfaFactors();
                    const verifiedTotp = factors?.totp?.find(f => f.status === 'verified');
                    if (verifiedTotp) {
                        pendingMfaFactorId = verifiedTotp.id;
                    } else {
                        throw new Error('Faktor 2FA tidak ditemukan.');
                    }
                }

                await challengeAndVerifyMfa(pendingMfaFactorId, code);

                // 2FA Sukses!
                clearRateLimitState();
                showSuccess('Verifikasi 2 langkah berhasil! Membuka dashboard...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (err) {
                registerFailedAttempt();
                clearOtpInputs();
                showError('Kode verifikasi 2 langkah tidak valid atau sudah kedaluwarsa.');
            } finally {
                btnVerify2FA.innerHTML = '<i class="fas fa-check-shield"></i> Verifikasi &amp; Masuk';
                btnVerify2FA.disabled = checkAndApplyLockout();
            }
        });
    </script>

    <!-- ================= KILLUA GODSPEED LIGHTNING ANIMATION ENGINE ================= -->
    <script>
        (function initKilluaCanvas() {
            const canvas = document.getElementById('killuaCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width = 0;
            let height = 0;
            let dpr = 1;
            let bolts = [];
            let particles = [];
            let shockwaves = [];
            let mouse = { x: -1000, y: -1000, active: false };

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize, { passive: true });
            resize();

            // Interactivity: pointer & touch support
            function handlePointer(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                mouse.x = clientX;
                mouse.y = clientY;
                mouse.active = true;

                // Chance to discharge electric spark near touch/pointer
                if (Math.random() < 0.35) {
                    createLightningBolt(
                        mouse.x + (Math.random() - 0.5) * 80,
                        mouse.y + (Math.random() - 0.5) * 80,
                        mouse.x + (Math.random() - 0.5) * 200,
                        mouse.y + (Math.random() - 0.5) * 200,
                        2,
                        '#00f0ff'
                    );
                }
            }
            window.addEventListener('mousemove', handlePointer, { passive: true });
            window.addEventListener('touchmove', handlePointer, { passive: true });
            window.addEventListener('mouseleave', () => { mouse.active = false; });
            window.addEventListener('touchend', () => { mouse.active = false; });

            // Lightning Bolt Generator (Kanmuru / Narukami electric arcs)
            class LightningSegment {
                constructor(x1, y1, x2, y2, color, width, alpha) {
                    this.x1 = x1;
                    this.y1 = y1;
                    this.x2 = x2;
                    this.y2 = y2;
                    this.color = color;
                    this.width = width;
                    this.alpha = alpha;
                    this.maxAlpha = alpha;
                    this.decay = 0.04 + Math.random() * 0.05;
                }
                update() {
                    this.alpha -= this.decay;
                }
                draw(ctx) {
                    if (this.alpha <= 0) return;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(this.x1, this.y1);
                    ctx.lineTo(this.x2, this.y2);
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.lineWidth = this.width;
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 12;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // Bright inner core
                    ctx.beginPath();
                    ctx.moveTo(this.x1, this.y1);
                    ctx.lineTo(this.x2, this.y2);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(0.8, this.width * 0.35);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            function createLightningBolt(x1, y1, x2, y2, branchDepth = 2, customColor = null) {
                const dist = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.max(3, Math.floor(dist / 22));
                const colors = ['#00f0ff', '#38bdf8', '#a855f7', '#ffffff'];
                const color = customColor || colors[Math.floor(Math.random() * colors.length)];
                
                let curX = x1;
                let curY = y1;
                const dx = (x2 - x1) / steps;
                const dy = (y2 - y1) / steps;

                for (let i = 1; i <= steps; i++) {
                    const progress = i / steps;
                    const jitter = (1 - Math.abs(progress - 0.5) * 1.5) * 35;
                    const nx = (i === steps) ? x2 : x1 + dx * i + (Math.random() - 0.5) * jitter;
                    const ny = (i === steps) ? y2 : y1 + dy * i + (Math.random() - 0.5) * jitter;
                    
                    bolts.push(new LightningSegment(curX, curY, nx, ny, color, Math.max(1, (1 - progress * 0.5) * 2.8), 0.9 + Math.random() * 0.1));

                    // Random sub-branching
                    if (branchDepth > 0 && Math.random() < 0.28) {
                        const bx = nx + (Math.random() - 0.5) * 70;
                        const by = ny + (Math.random() - 0.5) * 70;
                        createLightningBolt(nx, ny, bx, by, branchDepth - 1, color);
                    }

                    curX = nx;
                    curY = ny;
                }
            }

            // Floating Electric Nen Particles (Aura Sparks)
            const PARTICLE_COUNT = Math.min(45, Math.floor((window.innerWidth * window.innerHeight) / 22000));
            class NenParticle {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = Math.random() * width;
                    this.y = initial ? Math.random() * height : height + 10;
                    this.vx = (Math.random() - 0.5) * 1.2;
                    this.vy = -0.5 - Math.random() * 1.4;
                    this.size = 1.2 + Math.random() * 2.2;
                    this.baseAlpha = 0.3 + Math.random() * 0.6;
                    this.alpha = this.baseAlpha;
                    this.flickerSpeed = 0.05 + Math.random() * 0.1;
                    this.flickerOffset = Math.random() * Math.PI * 2;
                    this.hue = Math.random() < 0.75 ? (185 + Math.random() * 25) : (270 + Math.random() * 20); // Cyan or Violet Nen
                }
                update(t) {
                    this.x += this.vx + Math.sin(t * 0.002 + this.flickerOffset) * 0.4;
                    this.y += this.vy;
                    this.alpha = Math.max(0.1, this.baseAlpha + Math.sin(t * this.flickerSpeed + this.flickerOffset) * 0.35);

                    if (this.y < -20 || this.x < -20 || this.x > width + 20) {
                        this.reset(false);
                    }
                }
                draw(ctx) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${this.alpha})`;
                    ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, 0.9)`;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new NenParticle());
            }

            // Shockwave Electric Pulse
            class ElectricPulse {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 5;
                    this.maxRadius = 140 + Math.random() * 120;
                    this.alpha = 0.7;
                    this.speed = 3 + Math.random() * 2.5;
                }
                update() {
                    this.radius += this.speed;
                    this.alpha -= 0.018;
                }
                draw(ctx) {
                    if (this.alpha <= 0) return;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 240, 255, ${Math.max(0, this.alpha * 0.6)})`;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Timing & Autonomous discharge loop
            let lastBoltTime = 0;
            let nextBoltDelay = 400;

            function animate(time) {
                ctx.clearRect(0, 0, width, height);

                // Update & draw particles
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.update(time);
                    p.draw(ctx);

                    // Micro-arcs between close Nen particles
                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 55 && Math.random() < 0.12) {
                            ctx.save();
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(
                                (p.x + p2.x) / 2 + (Math.random() - 0.5) * 8,
                                (p.y + p2.y) / 2 + (Math.random() - 0.5) * 8
                            );
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
                            ctx.lineWidth = 1;
                            ctx.shadowColor = '#00f0ff';
                            ctx.shadowBlur = 6;
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                }

                // Random Autonomous Killua Lightning Discharge
                if (time - lastBoltTime > nextBoltDelay) {
                    lastBoltTime = time;
                    nextBoltDelay = 600 + Math.random() * 1200;

                    // Choose discharge origin & target
                    const startX = Math.random() * width;
                    const startY = Math.random() < 0.6 ? 0 : Math.random() * height;
                    const endX = startX + (Math.random() - 0.5) * 500;
                    const endY = startY + 180 + Math.random() * 320;

                    createLightningBolt(startX, startY, endX, endY, 2);

                    if (Math.random() < 0.4) {
                        shockwaves.push(new ElectricPulse(endX, endY));
                    }
                }

                // Update & draw shockwaves
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    shockwaves[i].update();
                    shockwaves[i].draw(ctx);
                    if (shockwaves[i].alpha <= 0 || shockwaves[i].radius >= shockwaves[i].maxRadius) {
                        shockwaves.splice(i, 1);
                    }
                }

                // Update & draw lightning bolts
                for (let i = bolts.length - 1; i >= 0; i--) {
                    bolts[i].update();
                    bolts[i].draw(ctx);
                    if (bolts[i].alpha <= 0) {
                        bolts.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>
