<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Nurul Fashion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            position: relative;
            overflow: hidden;
            font-family: 'Times New Roman', Times, serif;
        }
        body::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: loginGlow 8s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            animation: loginGlow 10s ease-in-out infinite alternate-reverse;
        }
        @keyframes loginGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -20px) scale(1.2); }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
            animation: cardSlideUp 0.5s ease;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 105, 180, 0.1);
        }
        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo .logo {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #FF69B4, #FFB6C1, #FF1493);
            color: #FFFFFF; font-size: 28px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px; margin: 0 auto 16px;
            box-shadow: 0 8px 30px rgba(255, 105, 180, 0.3);
            transition: transform 0.3s ease;
        }
        .login-logo .logo:hover { transform: rotate(-5deg) scale(1.05); }
        .login-logo h2 { font-size: 26px; font-weight: 700; color: #111; }
        .login-logo p { color: #666; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #222; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e5e7eb; border-radius: 10px;
            font-family: 'Times New Roman', Times, serif; font-size: 14px;
            transition: all 0.3s ease; outline: none; background: #FFF;
            box-sizing: border-box;
        }
        .form-group input:focus { border-color: #FF69B4; box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.1); }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 48px !important; }
        .password-toggle {
            position: absolute; right: 2px; top: 2px; bottom: 2px; width: 44px;
            background: transparent; border: none; border-radius: 8px;
            color: #666; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .password-toggle:hover { color: #FF69B4; background: rgba(255, 105, 180, 0.08); }
        .login-error {
            display: none; align-items: center; gap: 8px;
            padding: 12px 16px; background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444;
            border-radius: 10px; font-size: 13px; font-weight: 500;
            margin-bottom: 16px; animation: errorShake 0.4s ease;
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .login-success {
            display: none; align-items: center; gap: 8px;
            padding: 12px 16px; background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3); color: #22c55e;
            border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 16px;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 12px;
            font-family: 'Times New Roman', Times, serif; font-size: 15px; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: all 0.3s ease;
            border: none; justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: #FFFFFF; box-shadow: 0 4px 20px rgba(255, 105, 180, 0.3); width: 100%;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255, 105, 180, 0.5); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
        .btn-back-home {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 12px; padding: 12px; background: transparent; color: #666;
            border: 2px solid #e5e7eb; border-radius: 12px;
            font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: 500;
            text-decoration: none; transition: all 0.3s ease;
        }
        .btn-back-home:hover { border-color: #FF69B4; color: #FF69B4; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="logo">NF</div>
            <h2>Admin Login</h2>
            <p>Masuk ke dashboard Nurul Fashion</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="admin@nurulfashion.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="passwordToggle" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div id="loginError" class="login-error"></div>
            <div id="loginSuccess" class="login-success"></div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <a href="index.html" class="btn-back-home">
                <i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama
            </a>
        </form>
    </div>

    <script type="module">
        import { signInWithEmailAndPassword, onAuthStateChanged } from "../auth.js";

        // Jika sudah login, redirect ke admin
        onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'admin.html';
            }
        });

        // Password toggle
        document.getElementById('passwordToggle').addEventListener('click', () => {
            const input = document.getElementById('loginPassword');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            document.getElementById('passwordToggle').innerHTML = type === 'password' ? 
                '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            const successEl = document.getElementById('loginSuccess');

            if (!email || !password) {
                errorEl.textContent = '⚠️ Email dan password harus diisi!';
                errorEl.style.display = 'flex';
                successEl.style.display = 'none';
                return;
            }

            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                btn.disabled = true;
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                await signInWithEmailAndPassword(email, password);

                successEl.innerHTML = '✅ Login berhasil! Mengarahkan ke dashboard...';
                successEl.style.display = 'flex';

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);

            } catch (error) {
                let msg = 'Login gagal! ';
                const errMsg = error.message || '';
                if (errMsg.includes('Invalid login credentials') || errMsg.includes('invalid_credentials')) {
                    msg += 'Email atau password salah.';
                } else if (errMsg.includes('Email not confirmed')) {
                    msg += 'Email belum dikonfirmasi.';
                } else if (errMsg.includes('Invalid email')) {
                    msg += 'Format email tidak valid.';
                } else if (errMsg.includes('Too many requests') || errMsg.includes('rate_limit')) {
                    msg += 'Terlalu banyak percobaan. Coba lagi nanti.';
                } else {
                    msg += error.message;
                }
                errorEl.textContent = '⚠️ ' + msg;
                errorEl.style.display = 'flex';
                successEl.style.display = 'none';
            } finally {
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
