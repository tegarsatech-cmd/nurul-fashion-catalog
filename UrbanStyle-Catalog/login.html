<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login Admin - Nurul Fashion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { width: 100%; overflow-x: hidden; height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            background: #060913;
            position: relative;
            overflow-x: hidden;
            font-family: 'Times New Roman', Times, serif;
            width: 100%;
            max-width: 100%;
        }

        /* Killua Dynamic Electric Canvas */
        #killuaCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Killua Aura Vignette & Ambient Glow */
        .killua-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(3, 7, 18, 0.75) 90%),
                        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 50%);
        }

        /* 3D Scene Wrapper */
        .login-3d-scene {
            perspective: 1200px;
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 3;
            transform-style: preserve-3d;
        }

        /* Glassmorphic 3D Translucent Login Card */
        .login-card {
            background: rgba(9, 14, 30, 0.84);
            padding: 34px 28px;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 45px rgba(0, 240, 255, 0.2);
            width: 100%;
            position: relative;
            animation: cardSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(56, 189, 248, 0.45);
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 3D Layer Depth Offsets */
        .killua-character-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            transform: translateZ(40px);
            transform-style: preserve-3d;
        }

        .killua-speech-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(0, 240, 255, 0.18);
            border: 1.5px solid rgba(56, 189, 248, 0.6);
            border-radius: 20px;
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
            margin-bottom: 10px;
            animation: bubblePulse 2.5s ease-in-out infinite alternate;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            transform: translateZ(35px);
        }
        .killua-speech-bubble:hover {
            transform: translateZ(45px) scale(1.06);
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }

        @keyframes bubblePulse {
            0% { transform: translateY(0); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
            100% { transform: translateY(-3px); box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }
        }

        .killua-avatar-box {
            position: relative;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: killuaFloat 3.6s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.7)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.4));
            transition: transform 0.3s ease;
            transform: translateZ(35px);
            transform-style: preserve-3d;
        }
        .killua-avatar-box:hover {
            transform: translateZ(50px) scale(1.1);
        }

        @keyframes killuaFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1.5deg); }
        }

        /* Orbiting Nen Sparks */
        .nen-orbit-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1.5px dashed rgba(0, 240, 255, 0.5);
            animation: ringRotate 6s linear infinite;
            pointer-events: none;
        }
        .nen-orbit-spark {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .nen-orbit-spark.spark-2 {
            top: auto;
            bottom: -4px;
            background: #38bdf8;
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .killua-svg-art {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 100%);
            border: 2px solid #00f0ff;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.5);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Inner Animations */
        .killua-hair-anim {
            animation: hairWave 2.8s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }
        @keyframes hairWave {
            0% { transform: skewX(-1.5deg); }
            100% { transform: skewX(1.5deg); }
        }

        .killua-eyes-anim {
            animation: eyesGlow 2s ease-in-out infinite alternate;
        }
        @keyframes eyesGlow {
            0% { filter: drop-shadow(0 0 2px #00f0ff); opacity: 0.9; }
            100% { filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 12px #00f0ff); opacity: 1; }
        }

        .killua-sparks-anim {
            animation: electricFlicker 0.6s steps(2, start) infinite;
        }
        @keyframes electricFlicker {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ===== LOGO & HEADINGS ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 20px;
            transform: translateZ(25px);
        }
        .login-logo h2 {
            font-size: 25px;
            font-weight: 800;
            color: #FFFFFF !important;
            text-shadow: 0 2px 14px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.3);
            letter-spacing: 0.5px;
        }
        .login-logo p {
            color: #f1f5f9 !important;
            font-size: 13.5px;
            font-weight: 500;
            margin-top: 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }
        
        .security-badge-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(0, 240, 255, 0.16) !important;
            border: 1.5px solid rgba(56, 189, 248, 0.5) !important;
            border-radius: 20px;
            font-size: 11.5px;
            color: #38bdf8 !important;
            margin-top: 8px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
        }

        /* ===== FORM INPUTS (3D Depth, High Contrast & Clear) ===== */
        .form-group {
            margin-bottom: 15px;
            transform: translateZ(20px);
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #FFFFFF !important;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 15px;
            background: rgba(13, 21, 44, 0.92) !important;
            border: 1.5px solid rgba(148, 163, 184, 0.45) !important;
            border-radius: 10px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 15.5px;
            font-weight: 600;
            color: #FFFFFF !important;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .form-group input::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
            font-weight: 400;
        }
        .form-group input:focus {
            border-color: #00f0ff !important;
            background: rgba(15, 25, 55, 0.98) !important;
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.25), 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 48px !important; }
        .password-toggle {
            position: absolute; right: 2px; top: 2px; bottom: 2px; width: 44px;
            background: transparent; border: none; border-radius: 8px;
            color: #38bdf8 !important; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .password-toggle:hover { color: #ffffff !important; background: rgba(0, 240, 255, 0.15); }

        /* Robot Checkbox ('Saya bukan robot') Styles */
        .robot-check-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(13, 21, 44, 0.92) !important;
            border: 1.5px solid rgba(148, 163, 184, 0.45) !important;
            border-radius: 10px;
            padding: 11px 15px;
            margin-bottom: 16px;
            user-select: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
            transform: translateZ(22px);
        }
        .robot-check-container.error-highlight {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
        }
        .robot-check-container.verified {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.2) !important;
        }
        .robot-check-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .robot-checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #94a3b8;
            border-radius: 6px;
            background: rgba(30, 41, 59, 0.95);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.2s ease;
            position: relative;
        }
        .robot-checkbox:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .robot-checkbox:focus-visible {
            outline: 2px solid #00f0ff;
            outline-offset: 2px;
        }
        .robot-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2.5px solid #475569;
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: robotSpin 0.7s linear infinite;
        }
        @keyframes robotSpin {
            to { transform: rotate(360deg); }
        }
        .robot-check-icon {
            display: none;
            color: #10b981;
            font-size: 16px;
            animation: checkBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes checkBounce {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .robot-checkbox.loading {
            border-color: #00f0ff;
            background: rgba(30, 41, 59, 1);
        }
        .robot-checkbox.loading .robot-spinner {
            display: block;
        }
        .robot-checkbox.checked {
            border-color: #10b981;
            background: rgba(30, 41, 59, 1);
        }
        .robot-checkbox.checked .robot-check-icon {
            display: block;
        }
        .robot-label {
            font-size: 14.5px;
            font-weight: 700;
            color: #FFFFFF !important;
            cursor: pointer;
            margin: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .robot-check-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #cbd5e1 !important;
        }
        .robot-brand-icon {
            font-size: 18px;
            color: #00f0ff;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.6));
        }
        .robot-brand-text {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #cbd5e1 !important;
        }
        .robot-brand-links {
            font-size: 9px;
            color: #94a3b8 !important;
        }
        .robot-brand-links a {
            color: #cbd5e1 !important;
            text-decoration: none;
            font-weight: 600;
        }
        .robot-brand-links a:hover {
            color: #00f0ff !important;
            text-decoration: underline;
        }

        /* 2FA Form Step */
        .step-panel {
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateZ(20px);
        }
        .step-hidden {
            display: none !important;
        }
        .two-factor-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .two-factor-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(168, 85, 247, 0.3));
            border: 2px solid rgba(56, 189, 248, 0.5);
            color: #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 12px;
            box-shadow: 0 0 28px rgba(0, 240, 255, 0.45);
            animation: pulse2FA 2s infinite ease-in-out;
        }
        @keyframes pulse2FA {
            0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(0, 240, 255, 0.3); }
            50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(0, 240, 255, 0.6); }
        }
        .two-factor-header h3 {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff !important;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .two-factor-header p {
            font-size: 14px;
            color: #f1f5f9 !important;
            line-height: 1.45;
            font-weight: 500;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 18px 0;
        }
        .otp-digit {
            width: 48px;
            height: 52px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border: 2px solid rgba(56, 189, 248, 0.45);
            border-radius: 12px;
            background: rgba(13, 21, 44, 0.95);
            outline: none;
            transition: all 0.2s ease;
            font-family: monospace;
            color: #00f0ff !important;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }
        .otp-digit:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.3), 0 0 20px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Notice / Error / Info Messages */
        .login-error {
            display: none; align-items: flex-start; gap: 8px;
            padding: 13px 15px; background: rgba(220, 38, 38, 0.25) !important;
            border: 1.5px solid #ef4444 !important; color: #ffffff !important;
            border-radius: 10px; font-size: 13.5px; font-weight: 600;
            margin-bottom: 14px; animation: errorShake 0.4s ease;
            line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transform: translateZ(20px);
        }
        .login-info {
            display: none; align-items: flex-start; gap: 8px;
            padding: 13px 15px; background: rgba(2, 132, 199, 0.25) !important;
            border: 1.5px solid #38bdf8 !important; color: #ffffff !important;
            border-radius: 10px; font-size: 13.5px; font-weight: 600;
            margin-bottom: 14px; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transform: translateZ(20px);
        }
        .login-countdown {
            display: none; align-items: center; gap: 8px;
            padding: 13px 15px; background: rgba(217, 119, 6, 0.25) !important;
            border: 1.5px solid #f59e0b !important; color: #ffffff !important;
            border-radius: 10px; font-size: 13.5px; font-weight: 700;
            margin-bottom: 14px; line-height: 1.4; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transform: translateZ(20px);
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .login-success {
            display: none; align-items: center; gap: 8px;
            padding: 13px 15px; background: rgba(22, 163, 74, 0.25) !important;
            border: 1.5px solid #22c55e !important; color: #ffffff !important;
            border-radius: 10px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transform: translateZ(20px);
        }

        /* Buttons (3D Pop) */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px 24px; border-radius: 12px;
            font-family: 'Times New Roman', Times, serif; font-size: 15.5px; font-weight: 700;
            text-decoration: none; cursor: pointer; transition: all 0.3s ease;
            border: none; min-height: 46px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00f0ff 0%, #0284c7 45%, #FF1493 100%);
            color: #FFFFFF !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 22px rgba(0, 240, 255, 0.4), 0 0 18px rgba(255, 20, 147, 0.3);
            width: 100%;
            transform: translateZ(28px);
        }
        .btn-primary:hover {
            transform: translateZ(36px) translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.55), 0 0 28px rgba(255, 20, 147, 0.45);
        }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none !important; }
        
        .btn-secondary-action {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px; padding: 12px;
            background: rgba(15, 23, 42, 0.8) !important;
            color: #FFFFFF !important;
            border: 1.5px solid rgba(56, 189, 248, 0.4) !important;
            border-radius: 12px;
            font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: 600;
            text-decoration: none; transition: all 0.3s ease; width: 100%; cursor: pointer;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            transform: translateZ(18px);
        }
        .btn-secondary-action:hover {
            border-color: #00f0ff !important;
            color: #00f0ff !important;
            background: rgba(0, 240, 255, 0.12) !important;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
            transform: translateZ(24px);
        }

        /* Mobile Adjustments - Zero Lag Optimization */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .login-3d-scene { max-width: 100%; }
            .login-card {
                padding: 22px 16px !important;
                border-radius: 18px !important;
                backdrop-filter: blur(8px) !important;
                -webkit-backdrop-filter: blur(8px) !important;
            }
            .killua-avatar-box { width: 80px !important; height: 80px !important; }
            .killua-svg-art { width: 68px !important; height: 68px !important; }
            .login-logo h2 { font-size: 22px !important; }
            .login-logo p { font-size: 12.5px !important; }
            .otp-digit { width: 40px; height: 46px; font-size: 19px; }
            .form-group input { font-size: 14.5px !important; padding: 11px 13px !important; }
        }
    </style>
</head>
<body>
    <!-- Killua Animated Canvas -->
    <canvas id="killuaCanvas" aria-hidden="true"></canvas>
    <div class="killua-vignette" aria-hidden="true"></div>

    <div class="login-3d-scene" id="loginScene">
        <div class="login-card" id="loginCard">
        <!-- Killua Animated Character Component -->
        <div class="killua-character-wrapper">
            <div class="killua-speech-bubble" id="killuaSpeech">
                <i class="fas fa-bolt"></i> Killua: Godspeed Aktif!
            </div>
            <div class="killua-avatar-box" id="killuaAvatar" title="Klik Killua untuk memicu Petir Nen Narukami!">
                <div class="nen-orbit-ring">
                    <div class="nen-orbit-spark"></div>
                    <div class="nen-orbit-spark spark-2"></div>
                </div>
                <div class="killua-svg-art">
                    <svg viewBox="0 0 100 100" class="killua-svg" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="killuaHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="60%" stop-color="#e2e8f0"/>
                                <stop offset="100%" stop-color="#94a3b8"/>
                            </linearGradient>
                            <linearGradient id="killuaElectricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f0ff"/>
                                <stop offset="50%" stop-color="#38bdf8"/>
                                <stop offset="100%" stop-color="#a855f7"/>
                            </linearGradient>
                        </defs>
                        <!-- Killua Background Aura -->
                        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#killuaElectricGrad)" stroke-width="2.5" opacity="0.85"/>
                        <!-- Killua Body / Outfit (Collar) -->
                        <path d="M 22 96 Q 50 78 78 96 L 75 100 L 25 100 Z" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
                        <path d="M 36 84 L 50 94 L 64 84 Z" fill="#1e293b"/>
                        <!-- Killua Face -->
                        <polygon points="32,45 68,45 62,75 50,86 38,75" fill="#fde047" opacity="0.15"/>
                        <path d="M 32 46 Q 50 88 68 46 Q 66 76 50 86 Q 34 76 32 46 Z" fill="#ffedd5"/>
                        <!-- Killua Anime Eyes (Sapphire Electric Blue) -->
                        <g class="killua-eyes-anim">
                            <!-- Left Eye -->

    <script type="module">
        import supabase, {
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            getMfaAssuranceLevel,
            listMfaFactors,
            challengeAndVerifyMfa
        } from "./auth.js";

        // ===== 1. ANTI-CLICKJACKING FRAMEBUSTER =====
        if (window.top !== window.self) {
            try {
                window.top.location = window.self.location;
            } catch (e) {
                document.body.innerHTML = 'Akses melalui iframe diblokir demi keamanan.';
            }
        }

        // ===== 2. STATE & PERSISTENT BRUTE-FORCE RATE LIMITING =====
        const RATE_LIMIT_STORAGE_KEY = '_nf_auth_rate_guard_v2';
        const pageLoadTimestamp = Date.now();
        let isRobotVerified = false;
        let pendingMfaFactorId = null;
        let countdownInterval = null;

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const robotCheckbox = document.getElementById('robotCheckbox');
        const robotCheckContainer = document.getElementById('robotCheckContainer');
        const robotCheckTrigger = document.getElementById('robotCheckTrigger');

        const stepLogin = document.getElementById('stepLogin');
        const step2FA = document.getElementById('step2FA');
        const form2FA = document.getElementById('form2FA');
        const btnVerify2FA = document.getElementById('btnVerify2FA');
        const btnCancel2FA = document.getElementById('btnCancel2FA');
        const otpInputs = Array.from(document.querySelectorAll('.otp-digit'));

        const infoBannerEl = document.getElementById('loginInfoBanner');
        const countdownEl = document.getElementById('loginCountdown');
        const errorEl = document.getElementById('loginError');
        const successEl = document.getElementById('loginSuccess');

        // Check URL parameters for session notifications
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reason') === 'session_timeout') {
            infoBannerEl.innerHTML = '<i class="fas fa-info-circle"></i> Sesi Anda telah berakhir otomatis demi keamanan karena tidak ada aktivitas. Silakan login kembali.';
            infoBannerEl.style.display = 'flex';
        } else if (urlParams.get('reason') === 'unauthorized') {
            infoBannerEl.innerHTML = '<i class="fas fa-shield-alt"></i> Anda harus login terlebih dahulu untuk mengakses dashboard admin.';
            infoBannerEl.style.display = 'flex';
        }

        function getRateLimitState() {
            try {
                const data = localStorage.getItem(RATE_LIMIT_STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed && typeof parsed.attempts === 'number') {
                        return parsed;
                    }
                }
            } catch (e) {
                console.warn('Gagal membaca storage rate limit:', e);
            }
            return { attempts: 0, lockoutUntil: 0 };
        }

        function saveRateLimitState(attempts, lockoutUntil = 0) {
            try {
                localStorage.setItem(RATE_LIMIT_STORAGE_KEY, JSON.stringify({
                    attempts,
                    lockoutUntil,
                    updatedAt: Date.now()
                }));
            } catch (e) {
                console.warn('Gagal menyimpan storage rate limit:', e);
            }
        }

        function clearRateLimitState() {
            try {
                localStorage.removeItem(RATE_LIMIT_STORAGE_KEY);
            } catch (e) {}
        }

        function calculateLockoutDuration(attempts) {
            // Skema lockout bertingkat:
            // 3x salah: 60 detik (1 menit)
            // 4x salah: 180 detik (3 menit)
            // 5x+ salah: 600 detik (10 menit)
            if (attempts >= 5) return 600;
            if (attempts === 4) return 180;
            if (attempts >= 3) return 60;
            return 0;
        }

        function checkAndApplyLockout() {
            const state = getRateLimitState();
            const now = Date.now();
            if (state.lockoutUntil && state.lockoutUntil > now) {
                startCountdown(state.lockoutUntil);
                return true;
            } else if (state.lockoutUntil && state.lockoutUntil <= now) {
                // Lockout selesai
                stopCountdown();
                saveRateLimitState(Math.min(state.attempts, 2), 0);
            }
            return false;
        }

        function startCountdown(targetTime) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            loginBtn.disabled = true;
            if (btnVerify2FA) btnVerify2FA.disabled = true;

            const tick = () => {
                const remainingSec = Math.max(0, Math.ceil((targetTime - Date.now()) / 1000));
                if (remainingSec <= 0) {
                    stopCountdown();
                    return;
                }
                const mins = Math.floor(remainingSec / 60);
                const secs = remainingSec % 60;
                const timeText = mins > 0 ? `${mins} menit ${secs} detik` : `${secs} detik`;
                countdownEl.innerHTML = `<i class="fas fa-ban"></i> Terlalu banyak percobaan gagal. Akses dibatasi sementara selama <strong>${timeText}</strong> demi keamanan.`;
                countdownEl.style.display = 'flex';
                errorEl.style.display = 'none';
            };

            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        function stopCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            countdownEl.style.display = 'none';
            loginBtn.disabled = false;
            if (btnVerify2FA) btnVerify2FA.disabled = false;
        }

        function registerFailedAttempt() {
            const state = getRateLimitState();
            const newAttempts = state.attempts + 1;
            const lockoutDuration = calculateLockoutDuration(newAttempts);

            if (lockoutDuration > 0) {
                const lockoutUntil = Date.now() + lockoutDuration * 1000;
                saveRateLimitState(newAttempts, lockoutUntil);
                startCountdown(lockoutUntil);
            } else {
                saveRateLimitState(newAttempts, 0);
            }
            return newAttempts;
        }

        // ===== 3. VERIFIKASI "SAYA BUKAN ROBOT" =====
        function verifyRobotClick() {
            if (isRobotVerified) return;
            if (robotCheckContainer) robotCheckContainer.classList.remove('error-highlight');
            if (robotCheckbox) {
                robotCheckbox.classList.add('loading');
                robotCheckbox.setAttribute('aria-checked', 'mixed');
            }

            setTimeout(() => {
                if (robotCheckbox) {
                    robotCheckbox.classList.remove('loading');
                    robotCheckbox.classList.add('checked');
                    robotCheckbox.setAttribute('aria-checked', 'true');
                }
                if (robotCheckContainer) robotCheckContainer.classList.add('verified');
                isRobotVerified = true;
                errorEl.style.display = 'none';
            }, 600);
        }

        function resetRobotVerification() {
            isRobotVerified = false;
            if (robotCheckbox) {
                robotCheckbox.classList.remove('loading', 'checked');
                robotCheckbox.setAttribute('aria-checked', 'false');
            }
            if (robotCheckContainer) {
                robotCheckContainer.classList.remove('verified', 'error-highlight');
            }
        }

        if (robotCheckTrigger) {
            robotCheckTrigger.addEventListener('click', verifyRobotClick);
        }
        if (robotCheckbox) {
            robotCheckbox.addEventListener('click', (e) => {
                e.stopPropagation();
                verifyRobotClick();
            });
            robotCheckbox.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    verifyRobotClick();
                }
            });
        }

        // ===== 4. SECURE ERROR MESSAGING HELPER =====
        function showError(message) {
            errorEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span>${message}</span>`;
            errorEl.style.display = 'flex';
            successEl.style.display = 'none';
        }

        function showSuccess(message) {
            successEl.innerHTML = `<i class="fas fa-check-circle"></i> <span>${message}</span>`;
            successEl.style.display = 'flex';
            errorEl.style.display = 'none';
        }

        // ===== 5. 2FA (TWO-FACTOR AUTHENTICATION) DIGIT HANDLING =====
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                e.target.value = val ? val[0] : '';
                if (val && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
                const cleanDigits = pasteData.replace(/\D/g, '').slice(0, 6);
                if (cleanDigits) {
                    cleanDigits.split('').forEach((char, i) => {
                        if (otpInputs[i]) otpInputs[i].value = char;
                    });
                    const focusIdx = Math.min(cleanDigits.length, 5);
                    otpInputs[focusIdx].focus();
                }
            });
        });

        function getOtpCode() {
            return otpInputs.map(i => i.value).join('').trim();
        }

        function clearOtpInputs() {
            otpInputs.forEach(i => i.value = '');
            if (otpInputs[0]) otpInputs[0].focus();
        }

        function switchToStep(step) {
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            if (step === '2fa') {
                stepLogin.classList.add('step-hidden');
                step2FA.classList.remove('step-hidden');
                clearOtpInputs();
            } else {
                step2FA.classList.add('step-hidden');
                stepLogin.classList.remove('step-hidden');
                pendingMfaFactorId = null;
                resetRobotVerification();
            }
        }

        btnCancel2FA.addEventListener('click', async () => {
            try {
                await signOut();
            } catch (e) {}
            switchToStep('login');
        });

        // ===== 6. AUTH STATE CHECK ON LOAD =====
        onAuthStateChanged(async (user) => {
            if (user) {
                // Jangan auto-redirect jika sedang di tengah flow 2FA
                const assurance = await getMfaAssuranceLevel().catch(() => null);
                if (assurance?.nextLevel === 'aal2' && assurance?.currentLevel !== 'aal2') {
                    // Masih butuh faktor 2
                    return;
                }
                showSuccess('Sesi login terdeteksi. Mengarahkan...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 600);
            }
        });

        // Password Visibility Toggle
        document.getElementById('passwordToggle').addEventListener('click', () => {
            const input = document.getElementById('loginPassword');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            document.getElementById('passwordToggle').innerHTML = type === 'password' ?
                '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // Initialize state
        checkAndApplyLockout();

        // ===== 7. STEP 1 LOGIN SUBMIT HANDLER =====
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Cek lockout aktif
            if (checkAndApplyLockout()) return;

            // Honeypot Trap (Bot Protection)
            const hp1 = document.getElementById('hp_user_website')?.value;
            const hp2 = document.getElementById('hp_secondary_phone')?.value;
            if (hp1 || hp2) {
                // Silently block automated scraper bot
                showError('Aktivitas tidak wajar terdeteksi. Silakan muat ulang browser Anda.');
                return;
            }

            // Submission speed check (Human takes at least 0.8 seconds)
            if (Date.now() - pageLoadTimestamp < 800) {
                showError('Pengiriman form terlalu cepat terdeteksi. Silakan coba lagi.');
                resetRobotVerification();
                return;
            }

            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email || !password) {
                showError('Email dan password wajib diisi.');
                return;
            }

            // Validasi 'Saya bukan robot'
            if (!isRobotVerified) {
                showError("Silakan centang 'Saya bukan robot' terlebih dahulu.");
                if (robotCheckContainer) robotCheckContainer.classList.add('error-highlight');
                return;
            }

            try {
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi Kredensial...';
                loginBtn.disabled = true;
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                // Artificial delay (1s) to prevent high-speed brute force automated timing
                await new Promise(res => setTimeout(res, 900));

                const { user } = await signInWithEmailAndPassword(email, password);

                // Periksa apakah user memiliki 2FA aktif (Supabase MFA)
                const assurance = await getMfaAssuranceLevel();
                const factors = await listMfaFactors();
                const verifiedTotp = factors?.totp?.find(f => f.status === 'verified');

                if (verifiedTotp && (assurance?.nextLevel === 'aal2' || assurance?.currentLevel !== 'aal2')) {
                    // Alihkan ke Step 2: Verifikasi 2 Langkah
                    pendingMfaFactorId = verifiedTotp.id;
                    loginBtn.innerHTML = '<i class="fas fa-lock"></i> Masuk ke Dashboard';
                    loginBtn.disabled = false;
                    switchToStep('2fa');
                    return;
                }

                // Jika tidak ada 2FA, login langsung berhasil
                clearRateLimitState();
                showSuccess('Login berhasil! Mengarahkan ke dashboard admin...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (err) {
                // Increment failed attempts and apply lockout if threshold reached
                const attempts = registerFailedAttempt();
                resetRobotVerification();

                // OWASP Secure Error Message: Never enumerate whether email or password was wrong
                const maxAttemptsBeforeLock = 3;
                const remaining = Math.max(0, maxAttemptsBeforeLock - (attempts % maxAttemptsBeforeLock));
                let errorMsg = 'Email atau password yang Anda masukkan tidak valid.';
                if (remaining > 0 && attempts < 3) {
                    errorMsg += ` (Percobaan tersisa: ${remaining})`;
                }
                showError(errorMsg);

            } finally {
                if (!pendingMfaFactorId) {
                    loginBtn.innerHTML = '<i class="fas fa-lock"></i> Masuk ke Dashboard';
                    loginBtn.disabled = checkAndApplyLockout();
                }
            }
        });

        // ===== 8. STEP 2: 2FA VERIFY SUBMIT HANDLER =====
        form2FA.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (checkAndApplyLockout()) return;

            const code = getOtpCode();
            if (code.length !== 6) {
                showError('Masukkan 6 digit kode keamanan autentikasi.');
                return;
            }

            try {
                btnVerify2FA.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memvalidasi 2FA...';
                btnVerify2FA.disabled = true;
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                if (!pendingMfaFactorId) {
                    const factors = await listMfaFactors();
                    const verifiedTotp = factors?.totp?.find(f => f.status === 'verified');
                    if (verifiedTotp) {
                        pendingMfaFactorId = verifiedTotp.id;
                    } else {
                        throw new Error('Faktor 2FA tidak ditemukan.');
                    }
                }

                await challengeAndVerifyMfa(pendingMfaFactorId, code);

                // 2FA Sukses!
                clearRateLimitState();
                showSuccess('Verifikasi 2 langkah berhasil! Membuka dashboard...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (err) {
                registerFailedAttempt();
                clearOtpInputs();
                showError('Kode verifikasi 2 langkah tidak valid atau sudah kedaluwarsa.');
            } finally {
                btnVerify2FA.innerHTML = '<i class="fas fa-check-shield"></i> Verifikasi &amp; Masuk';
                btnVerify2FA.disabled = checkAndApplyLockout();
            }
        });
    </script>

    <!-- ================= 3D KILLUA GODSPEED LIGHTNING & CARD TILT ENGINE ================= -->
    <script>
        (function init3DKilluaExperience() {
            const isMobile = window.innerWidth <= 768 || ('ontouchstart' in window);
            const canvas = document.getElementById('killuaCanvas');
            const card = document.getElementById('loginCard');
            const scene = document.getElementById('loginScene');
            if (!canvas || !card) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width = 0;
            let height = 0;
            let dpr = 1;
            let centerX = 0;
            let centerY = 0;

            // 3D Camera Angles & Card Tilt Tracking
            let targetRx = 0;
            let targetRy = 0;
            let currentRx = 0;
            let currentRy = 0;
            let camAngleY = 0;
            let camAngleX = 0;

            function resize() {
                dpr = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
                width = window.innerWidth;
                height = window.innerHeight;
                centerX = width / 2;
                centerY = height / 2;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize, { passive: true });
            resize();

            // ===== 1. 3D INTERACTIVE CARD TILT & CAMERA CONTROL =====
            let isPointerActive = false;
            let lastTouchX = 0;
            let lastTouchY = 0;

            if (!isMobile) {
                // Desktop Mouse 3D Tilt
                window.addEventListener('mousemove', (e) => {
                    const normX = (e.clientX - centerX) / (centerX || 1);
                    const normY = (e.clientY - centerY) / (centerY || 1);
                    targetRy = normX * 14;
                    targetRx = -normY * 12;
                    camAngleY = normX * 0.25;
                    camAngleX = -normY * 0.18;
                    isPointerActive = true;
                }, { passive: true });

                window.addEventListener('mouseleave', () => {
                    targetRx = 0;
                    targetRy = 0;
                    camAngleX = 0;
                    camAngleY = 0;
                    isPointerActive = false;
                });
            } else {
                // Mobile Touch 3D Tilt with touch tracking
                window.addEventListener('touchstart', (e) => {
                    if (e.touches && e.touches[0]) {
                        lastTouchX = e.touches[0].clientX;
                        lastTouchY = e.touches[0].clientY;
                        isPointerActive = true;
                    }
                }, { passive: true });

                window.addEventListener('touchmove', (e) => {
                    if (e.touches && e.touches[0]) {
                        const normX = (e.touches[0].clientX - centerX) / (centerX || 1);
                        const normY = (e.touches[0].clientY - centerY) / (centerY || 1);
                        targetRy = normX * 8;
                        targetRx = -normY * 7;
                        camAngleY = normX * 0.15;
                        camAngleX = -normY * 0.12;
                    }
                }, { passive: true });

                window.addEventListener('touchend', () => {
                    isPointerActive = false;
                });
            }

            // ===== 2. 3D LIGHTNING BOLT SYSTEM =====
            let bolts = [];
            class LightningSegment3D {
                constructor(x1, y1, z1, x2, y2, z2, color, width, alpha) {
                    this.x1 = x1; this.y1 = y1; this.z1 = z1;
                    this.x2 = x2; this.y2 = y2; this.z2 = z2;
                    this.color = color;
                    this.width = width;
                    this.alpha = alpha;
                    this.decay = isMobile ? 0.07 : 0.05;
                }
                update() {
                    this.alpha -= this.decay;
                }
                draw(ctx, fov) {
                    if (this.alpha <= 0) return;
                    // Project Start Point in 3D
                    const zStart = this.z1 + 380;
                    const zEnd = this.z2 + 380;
                    if (zStart <= 10 || zEnd <= 10) return;

                    const scale1 = fov / zStart;
                    const px1 = centerX + this.x1 * scale1;
                    const py1 = centerY + this.y1 * scale1;

                    const scale2 = fov / zEnd;
                    const px2 = centerX + this.x2 * scale2;
                    const py2 = centerY + this.y2 * scale2;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(px1, py1);
                    ctx.lineTo(px2, py2);
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.lineWidth = Math.max(0.7, this.width * ((scale1 + scale2) * 0.5));
                    ctx.lineCap = 'round';
                    if (!isMobile) {
                        ctx.shadowColor = '#00f0ff';
                        ctx.shadowBlur = 8;
                    }
                    ctx.stroke();

                    // Core bright filament
                    ctx.beginPath();
                    ctx.moveTo(px1, py1);
                    ctx.lineTo(px2, py2);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(0.5, this.width * 0.35 * scale1);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            function createLightningBolt3D(x1, y1, z1, x2, y2, z2, branchDepth = 1, customColor = null) {
                const dist = Math.hypot(x2 - x1, y2 - y1, z2 - z1);
                const steps = Math.max(3, Math.min(isMobile ? 7 : 12, Math.floor(dist / 35)));
                const colors = ['#00f0ff', '#38bdf8', '#a855f7', '#ffffff'];
                const color = customColor || colors[Math.floor(Math.random() * colors.length)];
                
                let curX = x1, curY = y1, curZ = z1;
                const dx = (x2 - x1) / steps;
                const dy = (y2 - y1) / steps;
                const dz = (z2 - z1) / steps;

                for (let i = 1; i <= steps; i++) {
                    const progress = i / steps;
                    const jitter = (1 - Math.abs(progress - 0.5) * 1.5) * (isMobile ? 25 : 35);
                    const nx = (i === steps) ? x2 : x1 + dx * i + (Math.random() - 0.5) * jitter;
                    const ny = (i === steps) ? y2 : y1 + dy * i + (Math.random() - 0.5) * jitter;
                    const nz = (i === steps) ? z2 : z1 + dz * i + (Math.random() - 0.5) * jitter * 0.5;
                    
                    bolts.push(new LightningSegment3D(curX, curY, curZ, nx, ny, nz, color, Math.max(1, (1 - progress * 0.4) * 2.4), 0.95));

                    if (branchDepth > 0 && Math.random() < (isMobile ? 0.15 : 0.25)) {
                        const bx = nx + (Math.random() - 0.5) * 60;
                        const by = ny + (Math.random() - 0.5) * 60;
                        const bz = nz + (Math.random() - 0.5) * 40;
                        createLightningBolt3D(nx, ny, nz, bx, by, bz, branchDepth - 1, color);
                    }

                    curX = nx; curY = ny; curZ = nz;
                }
            }

            // ===== 3. 3D NEN FLOATING PARTICLES (Perspective Field) =====
            const PARTICLE_COUNT = isMobile ? 18 : 34;
            let particles = [];
            class Particle3D {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = (Math.random() - 0.5) * (width * 0.9);
                    this.y = initial ? (Math.random() - 0.5) * height : height * 0.55;
                    this.z = (Math.random() - 0.5) * 500;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = -0.4 - Math.random() * 0.9;
                    this.vz = (Math.random() - 0.5) * 0.6;
                    this.size = 1.4 + Math.random() * 2.2;
                    this.baseAlpha = 0.35 + Math.random() * 0.55;
                    this.alpha = this.baseAlpha;
                    this.hue = Math.random() < 0.75 ? 190 : 270;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.z += this.vz;

                    if (this.y < -height * 0.55 || Math.abs(this.x) > width * 0.6 || Math.abs(this.z) > 280) {
                        this.reset(false);
                    }
                }
                draw(ctx, fov) {
                    const z3d = this.z + 380;
                    if (z3d <= 10) return;

                    const scale = fov / z3d;
                    const px = centerX + this.x * scale;
                    const py = centerY + this.y * scale;
                    const r = Math.max(0.6, this.size * scale);

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${Math.max(0, this.alpha * scale * 1.1)})`;
                    if (!isMobile) {
                        ctx.shadowColor = '#00f0ff';
                        ctx.shadowBlur = 6;
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle3D());
            }

            // ===== 4. 3D EXPANDING SHOCKWAVE PULSE =====
            let shockwaves = [];
            class Shockwave3D {
                constructor(x, y, z) {
                    this.x = x; this.y = y; this.z = z;
                    this.radius = 4;
                    this.maxRadius = isMobile ? 90 : 140;
                    this.alpha = 0.8;
                    this.speed = isMobile ? 3.5 : 4.5;
                }
                update() {
                    this.radius += this.speed;
                    this.alpha -= 0.025;
                }
                draw(ctx, fov) {
                    if (this.alpha <= 0) return;
                    const z3d = this.z + 380;
                    if (z3d <= 10) return;
                    const scale = fov / z3d;
                    const px = centerX + this.x * scale;
                    const py = centerY + this.y * scale;
                    const rx = this.radius * scale;
                    const ry = rx * 0.6; // 3D Perspective Ellipse

                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 240, 255, ${Math.max(0, this.alpha * 0.7)})`;
                    ctx.lineWidth = Math.max(1, 2 * scale);
                    if (!isMobile) {
                        ctx.shadowColor = '#00f0ff';
                        ctx.shadowBlur = 10;
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // ===== 5. ANIMATION LOOP (Butter-smooth 60-120fps) =====
            let lastBoltTime = 0;
            let nextBoltDelay = 600;
            const FOV = 320;

            function animate(time) {
                // Smooth 3D Card Tilt Interpolation
                if (isMobile && !isPointerActive) {
                    // Mobile automatic gentle 3D pendulum float
                    targetRx = Math.sin(time * 0.0014) * 4;
                    targetRy = Math.cos(time * 0.0011) * 4.5;
                }
                currentRx += (targetRx - currentRx) * (isMobile ? 0.12 : 0.09);
                currentRy += (targetRy - currentRy) * (isMobile ? 0.12 : 0.09);

                card.style.transform = `rotateX(${currentRx.toFixed(2)}deg) rotateY(${currentRy.toFixed(2)}deg) translateZ(0)`;

                // Clear canvas
                ctx.clearRect(0, 0, width, height);

                // Update & draw 3D Nen particles
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(ctx, FOV);
                }

                // Periodic 3D Lightning Discharge
                if (time - lastBoltTime > nextBoltDelay) {
                    lastBoltTime = time;
                    nextBoltDelay = 800 + Math.random() * (isMobile ? 1800 : 1200);

                    const startX = (Math.random() - 0.5) * width * 0.9;
                    const startY = -height * 0.5;
                    const startZ = (Math.random() - 0.5) * 200;

                    const endX = startX + (Math.random() - 0.5) * 350;
                    const endY = height * 0.35 + Math.random() * (height * 0.2);
                    const endZ = startZ + (Math.random() - 0.5) * 200;

                    createLightningBolt3D(startX, startY, startZ, endX, endY, endZ, isMobile ? 1 : 2);

                    if (Math.random() < 0.3) {
                        shockwaves.push(new Shockwave3D(endX, endY, endZ));
                    }
                }

                // Update & draw 3D Shockwaves
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    shockwaves[i].update();
                    shockwaves[i].draw(ctx, FOV);
                    if (shockwaves[i].alpha <= 0 || shockwaves[i].radius >= shockwaves[i].maxRadius) {
                        shockwaves.splice(i, 1);
                    }
                }

                // Update & draw 3D Lightning Bolts
                for (let i = bolts.length - 1; i >= 0; i--) {
                    bolts[i].update();
                    bolts[i].draw(ctx, FOV);
                    if (bolts[i].alpha <= 0) {
                        bolts.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            // ===== 6. KILLUA AVATAR INTERACTIVE 3D DISCHARGE =====
            const killuaAvatar = document.getElementById('killuaAvatar');
            const killuaSpeech = document.getElementById('killuaSpeech');
            const speechQuotes = [
                '⚡ NARUKAMI: Sengatan Petir 3D Aktif!',
                '⚡ KANMURU: Kecepatan Godspeed Maksimal!',
                '⚡ BZZZT! Pertahanan Nen Telah Diperkuat!',
                '⚡ IZUTSUCHI: Petir Pembunuh Berkedip!'
            ];
            let quoteIdx = 0;

            if (killuaAvatar) {
                const triggerKilluaNen = (e) => {
                    const rect = killuaAvatar.getBoundingClientRect();
                    const kX = (rect.left + rect.width / 2) - centerX;
                    const kY = (rect.top + rect.height / 2) - centerY;
                    const kZ = 40;

                    // Unleash 3D lightning burst
                    const count = isMobile ? 4 : 6;
                    for (let k = 0; k < count; k++) {
                        const angle = (Math.PI * 2 / count) * k + (Math.random() - 0.5) * 0.4;
                        const dist = 140 + Math.random() * 140;
                        const tX = kX + Math.cos(angle) * dist;
                        const tY = kY + Math.sin(angle) * dist;
                        const tZ = kZ + (Math.random() - 0.5) * 120;
                        createLightningBolt3D(kX, kY, kZ, tX, tY, tZ, isMobile ? 1 : 2, '#00f0ff');
                    }
                    shockwaves.push(new Shockwave3D(kX, kY, kZ));

                    if (killuaSpeech) {
                        quoteIdx = (quoteIdx + 1) % speechQuotes.length;
                        killuaSpeech.innerHTML = `<i class="fas fa-bolt"></i> ${speechQuotes[quoteIdx]}`;
                        killuaSpeech.style.transform = 'translateZ(50px) scale(1.1)';
                        setTimeout(() => { killuaSpeech.style.transform = ''; }, 400);
                    }
                };

                killuaAvatar.addEventListener('click', triggerKilluaNen);
                if (killuaSpeech) killuaSpeech.addEventListener('click', triggerKilluaNen);
            }
        })();
    </script>
